<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RTMI-HRDC Library</title><link rel="stylesheet" href="style.css"></head><body>
<header><div class="logo">RTMI</div><div><h1>RTMI-HRDC Library</h1><small>Digital Library • Estd. 2015</small></div><button id="logout" class="hidden">Sign out</button></header>
<main><section id="login" class="panel login"><h2>Library Login</h2><form id="loginForm"><label>Email</label><input id="email" type="email" required><label>Password</label><input id="password" type="password" required><button>Sign in</button></form><p id="loginMsg"></p><small>Library accounts are created by the administrator.</small></section>
<section id="app" class="hidden"><h2>Library Dashboard</h2><p id="who"></p><div class="stats"><b>Catalogue records: <span id="count">0</span></b><b>Role: <span id="role"></span></b></div>
<section id="staff" class="panel hidden"><h3>Add a book (staff only)</h3><form id="bookForm" class="formgrid">
<div><label>Accession number *</label><input id="accession" required></div><div><label>Book title *</label><input id="title" required></div><div><label>Author</label><input id="author"></div><div><label>ISBN</label><input id="isbn"></div><div><label>DDC number</label><input id="ddc"></div><div><label>Category / course</label><input id="category"></div><div><label>Publisher</label><input id="publisher"></div><div><label>Edition</label><input id="edition"></div><div><label>Total copies</label><input id="copies" type="number" min="1" value="1"></div><div><label>Shelf location</label><input id="shelf"></div><div class="wide"><label>Description</label><textarea id="description"></textarea></div><div class="wide"><label>PDF file (optional)</label><input id="pdf" type="file" accept="application/pdf"></div><div class="wide"><button type="submit">Save book</button><span id="bookMsg"></span></div></form></section>
<section class="panel"><div class="catalogue"><h3>Book Catalogue</h3><input id="search" placeholder="Search title, author, ISBN or accession"></div><div class="tablewrap"><table><thead><tr><th>Accession</th><th>Title / Author</th><th>DDC</th><th>Category</th><th>PDF</th><th id="actionHead" class="hidden">Action</th></tr></thead><tbody id="rows"></tbody></table></div><p id="catalogueMsg"></p></section></section></main><footer>East Shahi Eidgah, TB Gate, Sylhet</footer><script type="module" src="app.js"></script></body></html>
